# ============================================================
#  gbadedata-web — CI
#  Platform : GitHub Actions
#  Deploy   : Cloudflare Pages (native Git integration)
#
#  Cloudflare builds and deploys on push to main by itself.
#  This workflow is the quality gate that runs alongside it:
#  if lint or build fails here, you know before checking the
#  live site.
#
#  Stages:  1. lint  → ESLint
#           2. build → production bundle + artifact check
# ============================================================

name: CI — Build & verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -d dist/assets     || { echo "::error::dist/assets missing"; exit 1; }
          echo "Build output verified."
          ls -lh dist dist/assets

      - name: Summary
        run: |
          {
            echo "### Build passed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Bundle | \`$(du -sh dist | cut -f1)\` |"
            echo ""
            echo "Cloudflare Pages deploys this commit automatically."
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
